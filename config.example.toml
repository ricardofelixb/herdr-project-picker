# Copy to the plugin config directory as config.toml:
#   herdr plugin config-dir local.project-picker
# Paths may start with "~". Nothing is assumed: with no roots or projects the
# picker just shows where to put this file.

# Folders whose direct, non-hidden subfolders are listed as projects.
roots = ["~/projects"]

# Folders that are projects themselves.
projects = []

# Where the manual action opens the project: "right" or "down".
direction = "right"

# Opt-in, unproven: also open the picker for new split panes. Off by default
# because Herdr 0.9.3 cannot say whether a pane was split by the user.
# See docs/INTEGRATION.md before enabling.
auto_trigger = false
