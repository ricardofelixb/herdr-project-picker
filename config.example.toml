# Optional. Copy to the plugin config directory as config.toml:
#   herdr plugin config-dir local.project-picker
#
# This file applies to the machine whose Herdr server runs the plugin (the
# "Current" tab). Other machines' tabs list the folders of the workspaces open
# there, and need no configuration. Without this file the picker still lists
# the folders of your open Herdr workspaces.
#
# Paths must be absolute or start with "~"; relative paths are rejected because
# Herdr resolves them in its own process.

# Folders whose direct, non-hidden subfolders are listed as projects.
roots = ["~/projects"]

# Folders that are projects themselves.
projects = []
