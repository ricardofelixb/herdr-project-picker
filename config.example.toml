# Optional. Copy to the plugin config directory as config.toml:
#   herdr plugin config-dir ricardofelixb.project-picker
#
# Every tab lists the folders of the Herdr workspaces open on that machine.
# Without this file the picker still works.
#
# One file can serve all your machines: each machine lists the roots that
# exist on it and skips paths that are absolute only on another system
# (C:\ on a Mac, / on Windows). Paths must be absolute or start with "~";
# relative paths are rejected because Herdr resolves them in its own process.

# Folders whose direct, non-hidden subfolders are listed as projects.
roots = ["~/projects"]

# Folders that are projects themselves, on the machine running the plugin.
projects = []

# Saved machines (the Herdr sidebar's other machines) list the roots written
# as ~, ~/... or /..., read-only over SSH, using the target Herdr saved for the
# machine, with BatchMode (no prompts). "~" is that machine's home.
# Unix-like machines only. To give one machine its own roots instead, key them
# by its name in the Herdr sidebar (or profile id):
# [machines.Mini]
# roots = ["~/Projects"]
