[package]
name = "herdr-project-picker"
version = "0.1.0"
edition = "2021"
description = "Project picker popup plugin for Herdr: machine tabs, searchable list, new pane per project"
rust-version = "1.82"
readme = "README.md"
keywords = ["herdr", "plugin", "project-picker"]

[dependencies]
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
strip = true
